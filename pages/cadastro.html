<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/cadastro.css" />
    <title>Página de Cadastro</title>
  </head>
  <body>
    <main>
      <h1 class="titulo">NOVO CADASTRO</h1>

      <form id="dados-cadastro">
        <fieldset class="fieldset-dados">
          <legend>INFORME SEUS DADOS PARA CADASTRO:</legend>
          <div class="container-inputs">
            <label
              >NOME:
              <input
                type="text"
                id="nome-usuario"
                required
                placeholder="João Silva"
            /></label>
          </div>
          <div class="container-inputs">
            <label
              >TELEFONE:
              <input
                type="tel"
                id="telefone"
                placeholder="54999999999"
                maxlength="11"
                inputmode="numeric"
                required
            /></label>
          </div>
          <div class="container-inputs">
            <label
              >SENHA:
              <input type="password" id="senha" minlength="8" required />
            </label>
          </div>
          <button type="submit">SALVAR</button>
        </fieldset>
      </form>
      <div id="container-mensagem-cadastro">
        <div id="mensagem-cadastro"></div>
      </div>
    </main>
    <footer class="rodape">
      <div class="container-info-rodape">
        <p>Sunset Beach Sports</p>
        <p>R. Olavo Bilac 261</p>
        <p>(54)99185-5959</p>
        <p>contato@SunsetBeachSports.com</p>
      </div>
    </footer>
    <script src="../javascript/usuarios.js"></script>
    <script src="../javascript/cadastro.js"></script>
  </body>
</html>
